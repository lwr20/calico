version: condensed
generateName: e2e-kind-operator-smoke-
schedule: 45 10 * * *
globalPrologue: 'cd "${CI_HOME}/${CI_GIT_DIR}"   # checkout lands here; make relative script paths resolve

  export ARGO_WORKFLOW_NAME="{{workflow.name}}"

  export BANZAI_CORE_BRANCH="argoci-kind-debug"

  export INSTALLER="${INSTALLER:-operator}"

  export USE_PRIVATE_REGISTRY="${USE_PRIVATE_REGISTRY:-true}"

  export PRIVATE_REGISTRY="${PRIVATE_REGISTRY:-quay.io/}"

  export FUNCTIONAL_AREA="${FUNCTIONAL_AREA:-kind-operator-smoke}"

  export E2E_TEST_CONFIG="${E2E_TEST_CONFIG:-e2e/config/argoci-nftables-smoke.yaml}"

  source .argoci/scripts/global_prologue.sh

  '
globalEpilogue: 'source "${CI_HOME}/${CI_GIT_DIR}/.argoci/scripts/global_epilogue.sh"

  '
defaults:
  secretBundles:
  - banzai-secrets
onExit:
- name: noop-exit
  checkout: true
  commands: 'echo "kind-operator smoke exit handler (no-op)"

    '
steps:
- name: kind-operator
  jobSize: large
  services:
  - docker
  env:
  - name: PROVISIONER
    value: local-kind
  - name: K8S_VERSION
    value: stable-3
  - name: ENABLE_DUAL_STACK
    value: 'true'
  - name: ENCAPSULATION_TYPE
    value: VXLAN
  - name: ENCAPSULATION_TYPE_V6
    value: VXLAN
  - name: IP_FAMILY
    value: dual
  - name: IPV4_POD_CIDR
    value: 192.168.0.0/16
  - name: IPV6_POD_CIDR
    value: fd00:10:244::/64
  - name: CLUSTER_NODES
    value: '0'
  - name: CLUSTER_MASTER_NODES
    value: '1'
  commands: '.argoci/scripts/body_standard.sh

    '
