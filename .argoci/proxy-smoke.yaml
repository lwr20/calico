version: condensed
generateName: http-cache-proxy-smoke-
steps:
  - name: proxy-smoke
    services: [http-cache-proxy]
    checkout: false
    commands: |
      echo "[test] HTTPS_PROXY=$HTTPS_PROXY"
      echo "[test] NO_PROXY=$NO_PROXY"
      # Runner image v0.104 doesn't yet trust the proxy CA; install it inline for this test.
      echo "" | base64 -d | sudo tee /usr/local/share/ca-certificates/argoci-github-cache-proxy.crt >/dev/null
      sudo update-ca-certificates
      URL="https://api.github.com/repos/projectcalico/calico/releases/latest"
      echo "[test] three identical GitHub API calls via the proxy (2nd/3rd should be cache HITs):"
      for n in 1 2 3; do
        curl -sS -o /dev/null -w "  call$n: http=%{http_code} time=%{time_total}s\n" "$URL"
      done
      echo "[test] done - check github-cache-proxy pod access.log for TCP_MEM_HIT"
